name: AuthForge CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter & Type Check
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema & Seed Test DB
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/authforge_test?schema=public"
        run: |
          npx prisma db push
          npm run prisma:seed

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/authforge_test?schema=public"
          REDIS_HOST: "localhost"
          REDIS_PORT: "6379"
          JWT_ACCESS_SECRET: "ci_test_access_secret_32bytes_key_string"
          JWT_REFRESH_SECRET: "ci_test_refresh_secret_32bytes_key_string"
        run: npm test

      - name: Build TypeScript Project
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: authforge:latest
